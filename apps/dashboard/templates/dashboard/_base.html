<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}NovaCRM X{% endblock %}</title>
  <meta name="description" content="NovaCRM X — enterprise multi-tenant CRM platform." />
  <meta name="csrf-token" content="{{ csrf_token }}" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef4ff',
              100: '#dde7ff',
              500: '#5B6CFF',
              600: '#4554F0',
              700: '#3b46cc',
              900: '#1a1f5c',
            },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
          },
        },
      },
    };
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
  {% block head_extra %}{% endblock %}
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100"
      x-data="{ darkMode: localStorage.getItem('nc-theme') === 'dark' }"
      x-init="$watch('darkMode', v => { localStorage.setItem('nc-theme', v ? 'dark' : 'light'); document.documentElement.classList.toggle('dark', v); }); document.documentElement.classList.toggle('dark', darkMode)">
  {% block body %}{% endblock %}
</body>
</html>
