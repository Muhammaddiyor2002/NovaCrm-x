{% extends "dashboard/_base.html" %}
{% block title %}Sign in — NovaCRM X{% endblock %}
{% block body %}
<div class="min-h-full flex items-center justify-center px-6 py-12">
  <div class="w-full max-w-md rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-8 shadow-sm">
    <div class="flex items-center gap-2 mb-6">
      <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-brand-500 text-white font-bold">N</span>
      <span class="font-semibold tracking-tight">NovaCRM X</span>
    </div>
    <h1 class="text-2xl font-semibold tracking-tight">Sign in</h1>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">Welcome back.</p>
    {% if messages %}
      {% for m in messages %}
        <div class="mt-4 rounded-lg border border-red-300 bg-red-50 px-4 py-2 text-sm text-red-800 dark:bg-red-950 dark:text-red-200">{{ m }}</div>
      {% endfor %}
    {% endif %}
    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      <div>
        <label class="text-sm font-medium">Email</label>
        <input name="email" type="email" required autocomplete="email"
               class="mt-1 block w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 px-3 py-2 text-sm focus:border-brand-500 focus:ring-brand-500" />
      </div>
      <div>
        <label class="text-sm font-medium">Password</label>
        <input name="password" type="password" required autocomplete="current-password"
               class="mt-1 block w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 px-3 py-2 text-sm focus:border-brand-500 focus:ring-brand-500" />
      </div>
      <button class="block w-full rounded-lg bg-brand-500 px-4 py-2 text-white font-medium hover:bg-brand-600">Sign in</button>
    </form>
    <p class="mt-6 text-sm text-slate-600 dark:text-slate-300">No account? <a class="text-brand-600 hover:underline" href="{% url 'dashboard:register' %}">Create one</a>.</p>
  </div>
</div>
{% endblock %}
