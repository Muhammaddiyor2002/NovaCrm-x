[project]
name = "novacrm-x"
version = "0.1.0"
description = "NovaCRM X — enterprise multi-tenant CRM platform built with Django."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "NovaCRM X Team" }]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by black
    "B008",  # function default arg call (Django common)
    "DJ001", # nullable CharField (we know what we're doing)
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E", "F", "I", "B", "UP"]
"**/settings/*" = ["F405", "F403"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "novacrm.settings.test"
python_files = ["test_*.py", "tests.py", "*_tests.py"]
addopts = "-ra --strict-markers --cov=apps --cov-report=term-missing --cov-report=xml"
testpaths = ["tests", "apps"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0   # tighten as suite grows

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
follow_imports = "silent"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["migrations", "build", "dist"]

[tool.django-stubs]
django_settings_module = "novacrm.settings.dev"
